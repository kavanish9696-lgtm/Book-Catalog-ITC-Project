<!-- SHUBHAM'S PART 2: Complete Add-Book Section (<section id="add-book">) -->
<!-- ============================================================ -->

    <!-- Add book form section -->
    <section id="add-book">
        <h2>Add a New Book</h2>
        <p class="section-intro">Use this form to enter the details of a new book to expand your collection catalog.</p>

        <!-- Form container (client-side only markup for HTML/CSS milestone) -->
        <form action="#" method="get" class="add-form">

            <!-- Field for book title -->
            <div class="form-group">
                <label for="new-book-title">Book Title:</label>
                <input type="text" id="new-book-title" name="title" placeholder="e.g. Clean Code">
            </div>

            <!-- Field for author name -->
            <div class="form-group">
                <label for="new-book-author">Author Name:</label>
                <input type="text" id="new-book-author" name="author" placeholder="e.g. Robert C. Martin">
            </div>

            <!-- Field for genre -->
            <div class="form-group">
                <label for="new-book-genre">Genre:</label>
                <input type="text" id="new-book-genre" name="genre" placeholder="e.g. Computer Science">
            </div>

            <!-- Field for rating -->
            <div class="form-group">
                <label for="new-book-rating">Rating (1 to 5):</label>
                <input type="text" id="new-book-rating" name="rating" placeholder="e.g. 5">
            </div>

            <!-- Field for cover image file name -->
            <div class="form-group">
                <label for="new-book-cover">Cover Image File Name:</label>
                <input type="text" id="new-book-cover" name="cover" placeholder="e.g. book7.jpg">
            </div>

            <!-- Field for description -->
            <div class="form-group">
                <label for="new-book-desc">Description:</label>
                <textarea id="new-book-desc" name="description" rows="4" placeholder="Enter a 2-3 sentence summary of the book..."></textarea>
            </div>

            <!-- Form action buttons -->
            <div class="form-buttons">
                <input type="submit" value="Add Book" class="btn btn-submit">
                <input type="reset" value="Reset Form" class="btn btn-reset">
            </div>

        </form>
    </section>
