<section id="add-book" class="form-section">
  <div class="section-heading">
    <h2 class="section-title">Add a New Book</h2>
    <p class="section-subtitle">Fill in the fields below to catalog a new title into your personal library.</p>
  </div>

 <form action="#" method="get" class="book-form">
    <div class="form-group">
      <label for="book-title" class="form-label">Book Title:</label>
      <input type="text" id="book-title" name="title" class="form-input" placeholder="e.g. Clean Code">
    </div>
    <div class="form-group">
      <label for="book-author" class="form-label">Author Name:</label>
      <input type="text" id="book-author" name="author" class="form-input" placeholder="e.g. Robert C. Martin">
    </div>
    <div class="form-group">
      <label for="book-genre" class="form-label">Genre / Category:</label>
      <input type="text" id="book-genre" name="genre" class="form-input" placeholder="e.g. Computer Science">
    </div>
    <div class="form-group">
      <label for="book-rating" class="form-label">Rating (1 to 5):</label>
      <input type="text" id="book-rating" name="rating" class="form-input" placeholder="e.g. 5">
    </div>
